apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: fcg
  labels:
    app: payments-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: payments-api
          image: fcg-payments-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: fcg-config            # shared: Kafka bootstrap, JWT issuer/audience
            - configMapRef:
                name: payments-api-config    # topics, group, reject threshold, Mongo db/collection
          env:
            # Mongo root password comes from the shared Secret; the connection string is
            # composed with k8s env substitution so the password is never duplicated.
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fcg-secret
                  key: Mongo__Password
            - name: Mongo__ConnectionString
              value: "mongodb://fcg:$(MONGO_PASSWORD)@mongo:27017/?authSource=admin"
            # SAME shared secret as users-api -> validates its JWTs for /api/payments.
            - name: Jwt__SecretKey
              valueFrom:
                secretKeyRef:
                  name: fcg-secret
                  key: Jwt__SecretKey
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
